<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to My Portfolio</h1>
        <button id="theme-toggle">Toggle Theme</button>
    </header>
    <main>
        <section id="skills">
            <h2>My Skills</h2>
            <div class="skill">
                <h3>HTML</h3>
                <div class="skill-animation"></div>
            </div>
            <div class="skill">
                <h3>CSS</h3>
                <div class="skill-animation"></div>
            </div>
            <div class="skill">
                <h3>JavaScript</h3>
                <div class="skill-animation"></div>
            </div>
        </section>
        <section id="projects">
            <h2>My Projects</h2>
            <div class="card" onmouseover="hoverEffect(this)" onmouseout="hoverEffectOut(this)">
                <h3>Project 1</h3>
                <p>Description of Project 1</p>
            </div>
            <div class="card" onmouseover="hoverEffect(this)" onmouseout="hoverEffectOut(this)">
                <h3>Project 2</h3>
                <p>Description of Project 2</p>
            </div>
            <div class="card" onmouseover="hoverEffect(this)" onmouseout="hoverEffectOut(this)">
                <h3>Project 3</h3>
                <p>Description of Project 3</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sahana810</p>
    </footer>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });

        // Smooth scrolling effect
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Parallax effect
        window.addEventListener('scroll', function() {
            const parallax = document.querySelector('.parallax');
            parallax.style.backgroundPositionY = `${window.scrollY * 0.5}px`;
        });

        // Skill animation on load
        window.onload = () => {
            document.querySelectorAll('.skill-animation').forEach(skill => {
                skill.classList.add('animate');
            });
        };

        // Hover effects for cards
        function hoverEffect(card) {
            card.style.transform = 'scale(1.1)';
        }
        function hoverEffectOut(card) {
            card.style.transform = 'scale(1)';
        }
    </script>
</body>
</html>
